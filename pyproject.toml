[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chainreact"
version = "0.0.1"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.5", "pyyaml", "tree-sitter>=0.23", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-java"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["chainreact*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
